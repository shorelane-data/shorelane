- id: mkt_d2c_cac_h1_2026
  domain: marketing
  tier: descriptive
  trap_tag: definition_outside_schema
  prompt: What was our d2c customer acquisition cost in the first half of 2026?
  persona: marketing
  pinned_scope:
    as_of: '2026-08-31'
    window:
      start: '2026-01-01'
      end: '2026-06-30'
  gold:
    kind: value
    value: 609.97
    unit: usd
    tolerance: 0.005
    components:
      ad_spend: 570927.81
      new_d2c_customers: 936
  gold_sql: |
    WITH spend AS (
      SELECT SUM(spend_usd) AS ad_spend
      FROM `nodal-shorelane.shorelane_bench_v1.fct_marketing_spend`
      WHERE spend_date BETWEEN '2026-01-01' AND '2026-06-30'
    ),
    acquired AS (
      SELECT COUNT(*) AS new_d2c_customers
      FROM `nodal-shorelane.shorelane_bench_v1.fct_orders`
      WHERE channel = 'd2c' AND is_first_order
        AND order_date BETWEEN '2026-01-01' AND '2026-06-30'
    )
    SELECT ROUND(ad_spend / new_d2c_customers, 2) AS value,
           ROUND(ad_spend, 2) AS ad_spend,
           new_d2c_customers
    FROM spend CROSS JOIN acquired
  silent_fail_values:
    per_platform_reported_conversions: 27.69
    fanned_out_attributed_customers: 203.32
  trap: The ad platforms' reported_conversions are self-reported and inflated; CAC on them looks far cheaper
    than it is. The warehouse-attributed denominator is first-ever d2c orders. fct_marketing_spend repeats
    that day total on every platform row, so summing it over rows multiplies the denominator by the number
    of platforms.
  context_required:
  - acf:domains/marketing/
  split: dev
  provenance:
    source: bi/ad-hoc/09_cac_reported_vs_attributed.sql
