- id: id_multi_source_gmv_2024
  domain: customers
  tier: descriptive
  trap_tag: fanout_cardinality
  prompt: What was 2024 GMV from customers we could resolve in at least two distinct source systems as
    of 2025-12-31? Include the order count and eligible canonical customer count.
  persona: finance
  pinned_scope:
    as_of: '2026-08-31'
    window:
      start: '2024-01-01'
      end: '2024-12-31'
    question_as_of: '2025-12-31'
  gold:
    kind: value
    value: 25703938.86
    unit: usd
    tolerance: 0.005
    measure: correct_multi_source_gmv
    components:
      correct_multi_source_order_count: 13020
      multi_source_canonical_customer_count: 22138
  gold_sql: |
    WITH eligible AS (
      SELECT i.app_db_customer_id
      FROM `nodal-shorelane.shorelane_bench_v1.int_customer_identity` i
      JOIN `nodal-shorelane.shorelane_bench_v1.stg_app_customers` c ON i.app_db_customer_id = c.app_db_customer_id
