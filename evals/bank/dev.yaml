- id: sub_renewal_rate_2025
  domain: subscriptions
  tier: descriptive
  trap_tag: definition_outside_schema
  prompt: What was our subscription renewal rate in 2025?
  persona: null
  pinned_scope:
    as_of: '2026-08-31'
    window:
      start: '2025-01-01'
      end: '2025-12-31'
  gold:
    kind: value
    value: 0.8201
    unit: ratio
    tolerance: 0.0001
    components:
      terms_decided: 2763
      churned_terms: 497
  gold_sql: |
    SELECT ROUND(COUNTIF(status = 'renewed') / COUNT(*), 4) AS value,
           COUNT(*) AS terms_decided,
           COUNTIF(status = 'churned') AS churned_terms
    FROM `nodal-shorelane.shorelane_bench_v1.fct_subscriptions`
    WHERE term_end_date BETWEEN '2025-01-01' AND '2025-12-31'
      AND status IN ('renewed', 'churned')
  silent_fail_values:
    acv_weighted: 0.8557
    renewal_share_of_terms_started: 0.7011
  trap: Renewal rate is renewed / (renewed + churned) over terms that ENDED in the period, counted in
    terms. An ACV-weighted rate is dollar retention, a different metric; renewals as a share of terms
    started answers "how much of our booking volume is renewals".
  context_required:
  - acf:domains/subscriptions/
  split: dev
  provenance:
    source: context/ground_truth/subscriptions_dashboard.md
    context_seed: renewal-rate.seed.yaml
