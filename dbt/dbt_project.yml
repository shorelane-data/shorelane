name: "shorelane"
version: "4.0.0"
config-version: 2

profile: "shorelane"

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Stamp every warehouse query so query-history extraction can classify this
# traffic as dbt on BOTH channels: the default {"app": "dbt", ...} query comment
# in the SQL text, and (job-label: true) the same keys as BigQuery job labels.
query-comment:
  job-label: true

# The `bench` target builds a frozen benchmark dataset (shorelane_bench_<v>) from
# a frozen raw snapshot (shorelane_raw_bench_<v>). There, every layer is a TABLE:
# a benchmark dataset must be self-contained, so agents need one read grant and no
# view can reach back into raw. Descriptions are deliberately NOT persisted to the
# warehouse (no persist_docs) on any target: in the benchmark, dbt documentation
# reaches an agent only through the dbt project files its mode mounts.
on-run-start:
  - "{{ assert_raw_dataset_matches_target() }}"

models:
  shorelane:
    staging:
      +materialized: "{{ 'table' if target.name == 'bench' else 'view' }}"
    intermediate:
      +materialized: "{{ 'table' if target.name == 'bench' else 'view' }}"
    marts:
      +materialized: table

vars:
  # Dataset the sources read. Daily: shorelane_raw. Bench: shorelane_raw_bench_<v>,
  # passed with --vars by the bench-build workflow and checked by on-run-start.
  raw_dataset: "shorelane_raw"
  dataset_version: "shorelane-v4"
  identity_migration_date: "2021-07-01"
